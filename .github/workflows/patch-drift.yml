name: patch drift

# Regenerating a patch fetches upstream sources and builds pi's workspace packages, which is far too slow to
# run on every pull request. It runs when the authored overlay or the pipeline changes, on a weekly schedule
# so upstream-side breakage (a withdrawn toolchain version, a re-published artifact) surfaces on its own, and
# on demand. The fast offline gates in check.yml keep running on every pull request.

on:
  pull_request:
    paths:
      - "pi-overlay/**"
      - "patches/**"
      - "scripts/build-pi-patch.mjs"
      - "scripts/build-pi-upgrade.mjs"
      - ".github/workflows/patch-drift.yml"
  push:
    branches: [main]
    paths:
      - "pi-overlay/**"
      - "patches/**"
      - "scripts/build-pi-patch.mjs"
      - "scripts/build-pi-upgrade.mjs"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Same .npmrc cooldown bypass as check.yml: the pinned pi 1.3.0 packages are newer than min-release-age=5.
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --min-release-age=0 --registry=https://registry.npmjs.org/
      # Regeneration needs npm and github.com. If either is unreachable the pipeline throws, which fails the
      # job: an unverifiable patch must never look the same as a verified one.
      # `patches:check` passes `--all`, so every version under pi-overlay/versions/ is regenerated, not only the
      # one the development dependencies pin.
      - name: Regenerate every version's patch and compare against the committed artifacts
        run: npm run patches:check
      - name: Install isolated Pi 1.6.0 runtime fixture
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-skills-test" --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org/ @earendil-works/pi-coding-agent@1.6.0
          # The fixture finder requires a node_modules directory at the package root; npm may hoist all dependencies.
          package="$RUNNER_TEMP/pi-skills-test/node_modules/@earendil-works/pi-coding-agent"
          if [ ! -d "$package/node_modules" ]; then
            ln -s "$RUNNER_TEMP/pi-skills-test/node_modules" "$package/node_modules"
          fi
      - name: Verify Pi 1.6.0 catalog, activation, CLI, and bundled entrypoints
        env:
          PI_SKILLS_TEST_PACKAGES: ${{ runner.temp }}/pi-skills-test/node_modules/@earendil-works/pi-coding-agent
        run: >-
          node --test scripts/skills-catalog.test.mjs scripts/skills-patch-dispatch.test.mjs
          scripts/skills-patch-entrypoint.test.mjs
